# Site-level configuration (read by both Astro and the uniblog CLI).
title:
  zh-Hans: uniblog
  zh-Hant: uniblog
  en-US: uniblog
  ja: uniblog
description:
  zh-Hans: 一个多语言博客
  en-US: A multilingual blog
author: Azote
url: https://example.com
defaultLocale: zh-Hans

locales:
  zh-Hans: { path: zh-hans, label: 简体中文 }
  zh-Hant: { path: zh-hant, label: 繁體中文, derive: { from: zh-Hans, opencc: s2twp } }
  en-US: { path: en-us, label: English }
  ja: { path: ja, label: 日本語 }

translate:
  zhPivot: zh-Hans
  default: { provider: gemini, model: gemini-flash-latest }
  overrides: {}
  onBuild: stale # stale | none

theme:
  style: paper
  styles: [paper, slate, ink, terminal]
  compare: true

deploy:
  provider: cloudflare-pages
  project: uniblog

contentLicense:
  name: CC BY 4.0
  url: https://creativecommons.org/licenses/by/4.0/
